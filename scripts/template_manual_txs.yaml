bridge: harmony
blockchains:
  - blockchain: ethereum
    txs:
      - tx_hash: "0x4a59c3e5c48ae796fe4482681c3da00c15b816d1af9d74210cca5e6ea9ced191"
        block_number: 15012699 # int
        timestamp: 1655983134 # int
        attack: True # if the transaction is part of an attack, activate this flag.
        tx_chain_type: source / destination / offchain # if the transaction is part of a cctx
        main_interaction:
          from:
          from_type: user / token / router / log_event / other_account / validator
          to:
          to_type: user / token / router / log_event / other_account / validator
          value: 1500000000000000 # To make this a non-value tx, don't include this and the below subfields
          input: "0x"
          token_symbol: "ETH"
          token_address: "0xc02aaa39b223fe8d0a0e5c4f27ead9083c756cc2"
        internal_txs:
          - from: # optional, if not the emmitter
            from_type: user / token / router / log_event / other_account / validator
            to: # optional, if not the emmitter
            to_type: user / token / router / log_event / other_account / validator
            value: 1500000000000000 # To make this a non-value tx, don't include this and the below subfields
            input: "0x" #hex
            token_symbol: "ETH"
            token_address: "0xc02aaa39b223fe8d0a0e5c4f27ead9083c756cc2"
        events:
          - emmitted_by: "0x715cdda5e9ad30a0ced14940f9997ee611496de6"
            emmitter_type: user / token / router / log_event / other_account / validator
            event_signature: "event Name Confirmation (index_topic_1 address sender, index_topic_2 uint256 transactionId)"
            event_type: transfer / ...
            num_args: 0
            input: ""
            relations:
              - from: # optional, in case it's not the emitter
                from_type: user / token / router / log_event / other_account / validator
                to: # optional, in case it's not the emitter
                to_type: user / token / router / log_event / other_account / validator
                relation_type: log_relation / token_auth / other_relation
            value: 1500000000000000 #only in token transfers or router events specifying amounts
            token_symbol: "USDC" # only in token transfers or router events specifying amounts
            token_address: "" # specify in case the address field is not a token contract
            token_decimals: 18 # only in token transfers or router events specifying amounts
cctx_linking:
  - source_blockchain: ethereum
    source_tx_hash: "0x4a59c3e5c48ae796fe4482681c3da00c15b816d1af9d74210cca5e6ea9ced191"
    source_timestamp: 1655983134
    source_cctx_from: "" # router address to create edge from
    target_blockchain: harmony
    target_tx_hash: "0x123456789abcdef1234567890abcdef1234567890abcdef1234567890abcdef"
    target_timestamp: 1655983200
    source_cctx_to: "" # router address to create edge to
    cctx_id: "kdjkdsf"
